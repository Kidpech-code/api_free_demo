<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No.1 — Mission Control · Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep:       #03040e;
      --bg-space:      #060918;
      --glass-bg:      rgba(12, 18, 48, 0.55);
      --glass-border:  rgba(100, 140, 255, 0.18);
      --glass-shadow:  rgba(0, 10, 60, 0.7);
      --accent-cyan:   #00e5ff;
      --accent-orange: #ff8c00;
      --accent-magenta:#e040fb;
      --accent-green:  #00e676;
      --purple-mid:    #7c4dff;
      --blue-mid:      #1a6bff;
      --text-primary:  #e8eeff;
      --text-secondary:#8899cc;
      --text-dim:      #4a5580;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
    }
    .cosmos {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(72,52,180,0.22) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 85%,  rgba(0,120,180,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 60% 30%,  rgba(140,40,200,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 70% 55% at 10% 80%,  rgba(0,180,200,0.10) 0%, transparent 65%),
        linear-gradient(160deg, #03040e 0%, #060918 50%, #04061a 100%);
    }
    .stars-layer {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        radial-gradient(1px 1px at 15% 8%,   rgba(220,230,255,0.75) 0%, transparent 100%),
        radial-gradient(1px 1px at 62% 14%,  rgba(200,210,255,0.60) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 80% 5%, rgba(255,255,255,0.80) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 22%,  rgba(180,200,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 30%,  rgba(200,220,255,0.65) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  45%,  rgba(210,220,255,0.50) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 55%,  rgba(220,230,255,0.45) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 75% 65%, rgba(255,255,255,0.70) 0%, transparent 100%),
        radial-gradient(1px 1px at 28% 70%,  rgba(180,200,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 75%,  rgba(200,215,255,0.60) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 88%,  rgba(210,225,255,0.50) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 92%,  rgba(180,200,255,0.45) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 42% 38%, rgba(255,255,255,0.65) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 48%,  rgba(200,215,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 52%,  rgba(215,225,255,0.45) 0%, transparent 100%);
    }

    .card {
      position: relative; z-index: 1;
      width: 360px;
      padding: 44px 36px 40px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 24px 64px var(--glass-shadow);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--accent-cyan) 100%);
      border-radius: 14px;
      font-size: 28px;
      box-shadow: 0 0 28px rgba(0,229,255,0.40);
    }
    h1 {
      font-size: 20px; font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .sub {
      font-size: 13px; color: var(--text-secondary);
      margin-bottom: 36px;
      line-height: 1.5;
    }
    .sub strong { color: var(--accent-cyan); }

    .btn-github {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .btn-github:hover {
      background: rgba(255,255,255,0.11);
      border-color: rgba(0,229,255,0.35);
      box-shadow: 0 0 20px rgba(0,229,255,0.15);
    }
    .btn-github svg { flex-shrink: 0; }

    .lock-note {
      margin-top: 28px;
      font-size: 11px; color: var(--text-dim);
      line-height: 1.6;
    }
    .lock-note span { color: rgba(224,64,251,0.8); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card { animation: fadeUp 0.45s ease both; }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 480px) {
      html, body { align-items: flex-start; overflow: auto; padding: 20px 12px 40px; }
      .card { width: 100%; padding: 32px 20px 28px; border-radius: 18px; }
      h1 { font-size: 18px; }
      .sub { font-size: 12px; margin-bottom: 28px; }
      .btn-github { padding: 12px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="cosmos"></div>
<div class="stars-layer"></div>

<div class="card">
  <div class="logo">🚀</div>
  <h1>Mission Control</h1>
  <p class="sub">This dashboard is restricted to<br/><strong>authorised crew only</strong>.</p>

  <a class="btn-github" href="/auth/github/login">
    <!-- GitHub Mark SVG -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
    </svg>
    Continue with GitHub
  </a>

  <p class="lock-note">
    <span>🔒</span> Access is restricted to the owner's GitHub account.<br/>
    Unauthorised attempts are logged.
  </p>
</div>
</body>
</html>
